# Hardware sorter configuration: every hand-edited tunable lives here.
# Override per machine in config/local.toml (same layout, only the keys you change).
# Values measured by the calibration tool are written to config/calibration/<machine>.json,
# never to this file.
schema_version = 1

[camera]
backend = "auto"            # auto | avfoundation (macOS) | v4l2 (Linux, milestone 5)
usb_vendor_id = 0x0C45      # Sonix bridge in the Innomaker U20CAM-9281M
usb_product_id = 0x636D
width = 1280
height = 800
fps = 120.0
exposure_ms = 0.5           # fixed exposure; the camera accepts 0.1 ms steps, 0.2 ms minimum
flip_horizontal = false     # set by calibration if the image arrives mirrored
flip_vertical = false
queue_frames = 240          # capture queue depth (2 s); overflow is counted and logged
lens_focal_mm = 8.0         # used only as the fixed focal length in the distortion fit
pixel_pitch_um = 3.0        # OV9281

[belt]
speed_in_s = 4.0            # nominal; the measured value is stored in calibration
loop_length_in = 52.0       # nominal; one stitched seam per loop
rework_gap_in = 1.0         # parts closer than this along the belt form one group

[timing]
# UNCALIBRATED placeholders until system timing calibration (milestone 4).
calibrated = false
exit_to_belt_end_in = 12.0  # right edge of the camera view to the end of the belt
collector_lead_ms = 500.0   # time the collector needs before the part falls
camera_latency_ms = 20.0    # exposure to frame timestamp

[recording]
dir = "recordings"
zstd_level = 1              # lossless; about 8x smaller than raw on real frames
queue_frames = 1200         # writer queue depth (10 s) so disk stalls never block capture

[roi]
mode = "auto"               # auto | manual
top = 0                     # manual belt edges in pixels (used when mode = "manual")
bottom = 800
margin_px = 6               # shrink the detected belt by this much on each side

[focus]
edge_width_good_px = 2.2    # 10-90% edge width at or below this is sharp
edge_width_soft_px = 3.2    # above this is too soft to measure reliably

[exposure]
max_blur_px = 0.75          # motion blur allowed at belt speed
belt_target_level = 180     # desired belt gray level (0-255)
belt_min_level = 90         # below this, warn that there is not enough light
flicker_warn_pct = 3.0      # frame-to-frame brightness swing that triggers a lighting warning

[calibration_target]
squares_x = 16              # ChArUco board, 16 x 10 squares of 5 mm = 80 x 50 mm
squares_y = 10
square_mm = 5.0
marker_mm = 3.5
scale_bar_mm = 50.0         # printed bar the user measures to correct printer scaling

[gui]
display_fps = 30

[segment]
deviation_threshold = 0.12  # |flat - 1| above this is part (flat-fielded belt is ~1.0)
edge_threshold = 0.03       # sub-pixel edge level: |flat - 1| crossing that places the contour
edge_gradient_threshold = 0.08  # |grad flat| per px that marks a sharp edge
shadow_max_depth = 0.10     # soft dark regions shallower than this are shadow, not part
gain_alpha = 0.05           # slow per-frame brightness-gain tracker rate
subpixel_smooth_px = 0.7    # gaussian sigma before sub-pixel refinement
min_area_in2 = 0.01         # smaller blobs are dust (square inches)
close_kernel_px = 3         # morphological close kernel, pixels
coarse_scale = 2            # 1 = old full-frame path; 2 = two-stage coarse-then-crop
crop_pad_px = 16            # full-res padding around the coarse blob crop (>= 12)

[seam]
enabled = true
angle_deg = 50.0            # degrees from the travel axis (+x) toward +y (image y down); as synthetic.py
width_in = 0.2              # nominal seam band width, inches (as synthetic.py)
angle_tol_deg = 10.0        # accepted deviation from angle_deg
width_tol_in = 0.1          # accepted deviation from width_in
template_frames = 30        # frames averaged to learn the seam template
speed_window = 15           # seam sightings smoothed for the belt speed estimate

[track]
gate_in = 0.5               # max belt-frame distance to link a blob to a track (inches)
settle_frames = 3           # frames before a track counts as settled
max_missed_frames = 3       # frames a track may go unseen before it finishes
speed_tolerance = 0.15      # allowed fractional deviation from belt speed
max_area_change = 0.15      # fractional frame-to-frame area jump counts as unstable outline
min_frames = 5              # fewer valid frames sets TrackFlag.FEW_FRAMES

[features]
elongated_min_aspect = 1.8      # length/width above which bolt-profile features are computed
hole_bright_threshold = 0.90    # flat (part/belt) above this inside a part = see-through hole (washer ~1.0)
hole_dark_threshold = 0.30      # flat below this inside a part = dark bore (nut ~0.21; bodies >= 0.40)
hole_min_diameter_in = 0.08     # smaller holes are noise
min_valid_frames = 3            # fewer valid observations cannot be fused
radial_samples = 180            # contour radial-profile samples (hex harmonic)

[classify]
confidence_threshold = 1.0      # worst-feature score at or below this fits a class
out_of_scope_threshold = 1.5    # best score above this is out of scope
min_frames = 5                  # fewer fused frames can never be CONFIDENT
library_path = "config/parts_library.yaml"  # relative to the project root
derive_margin = 0.1            # fractional range padding when deriving ranges

[scheduler]
enabled = true
spin_ms = 4.0               # busy-wait window before a send time
screen_log_keep = 50        # last N sends kept for the GUI/screen log

[pipeline]
decision_log_dir = "decisions"  # relative to the session folder
crop_dir = "crops"              # relative to the session folder
save_crops = true
save_full_frames = true         # full-frame reference per part, for grading
crop_pad_in = 0.15              # padding around a part crop, inches
frame_stride = 2                # process a frame only when seq % frame_stride == 0
feature_stride = 3              # feature extraction every Nth PROCESSED frame
max_feature_frames = 10         # per-track cap on frames kept for features (>= classify/features minimums)
queue_frames = 120              # pipeline input queue depth, frames
