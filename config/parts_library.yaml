# Parts library: per part, per pose, feature -> [lo, hi] acceptance range.
# Feature names are those of vision/features (task 007). Score per feature is
# |value - centre| / half-width (0 at centre, 1 at the range edge); a pose's score is its
# worst feature. A required feature whose fused value is NaN (unavailable) makes the pose
# not fit (score inf), never a pass. edge_sharpness is a focus signal and is not used here.
# Ranges come from measured synthetic values (nominal dims, generous tolerance). Upper edges
# allow ~10% parallax on tall parts (bolt heads). Re-derive from real captures with
# classify.derive_ranges. Poses not listed here (e.g. a bolt standing up, a washer on edge)
# fall out of scope and go to MISC. Future note: M6 vs 1/4 differ by ~0.01 in, which this
# library cannot separate; that needs thread pitch (reserved feature, not built).
# hole_kind is a categorical median code (0 none / 1 bright / 2 dark); ranges bracket the code
# (+-0.5) so a split-vote 0.5 or 1.5 sits on an edge.
# output_code is the serial code for the part's bin.
parts:
  bolt_025:
    display_name: "1/4-20 x 1 hex bolt"
    output_code: 1
    poses:
      side:
        minrect_long_in: [1.05, 1.28]
        minrect_short_in: [0.45, 0.58]
        shank_width_in: [0.20, 0.30]
        head_width_in: [0.44, 0.58]
        head_length_in: [0.10, 0.21]
        total_length_in: [1.05, 1.28]
  bolt_0375:
    display_name: "3/8-16 x 1 hex bolt"
    output_code: 2
    poses:
      side:
        minrect_long_in: [1.15, 1.38]
        minrect_short_in: [0.59, 0.73]
        shank_width_in: [0.32, 0.43]
        head_width_in: [0.59, 0.73]
        head_length_in: [0.17, 0.29]
        total_length_in: [1.15, 1.38]
  nut_025:
    display_name: "1/4-20 hex nut"
    output_code: 3
    poses:
      flat:
        area_in2: [0.14, 0.20]
        across_flats_in: [0.40, 0.49]
        hex_harmonic: [0.025, 0.095]
        circularity: [0.85, 0.97]
        hole_kind: [1.5, 2.5]
      side:  # rectangle outline: width = across flats or corners, height = 0.219 thick
        minrect_long_in: [0.40, 0.54]
        minrect_short_in: [0.17, 0.27]
        hole_kind: [-0.5, 0.5]
  nut_0375:
    display_name: "3/8-16 hex nut"
