        hex_harmonic: [0.025, 0.095]
        circularity: [0.85, 0.97]
        hole_kind: [1.5, 2.5]
      side:  # rectangle outline: width = across flats or corners, height = 0.328 thick
        minrect_long_in: [0.52, 0.69]
        minrect_short_in: [0.27, 0.38]
        hole_kind: [-0.5, 0.5]
  washer_025:
