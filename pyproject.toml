[project]
name = "hwsorter"
version = "0.1.0"
description = "Vision and control program for the prototype fastener sorter"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pydantic>=2.8",
    "zstandard>=0.23",
    "PySide6-Essentials>=6.8",
    # macOS camera backend: native capture (PyObjC) plus UVC control requests (libusb).
    "pyobjc-framework-AVFoundation>=11; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=11; sys_platform == 'darwin'",
    "pyusb>=1.3; sys_platform == 'darwin'",
    "libusb-package>=1.0.26; sys_platform == 'darwin'",
]

[project.scripts]
sorter = "hwsorter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwsorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
